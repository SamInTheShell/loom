[project]
name = "loom"
version = "0.1.0"
description = "Loom - a library-centric local LLM workbench: llama-server manager (local and over SSH) plus chat with container-sandboxed tools. Fully offline pywebview app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "pyside6>=6.11.2",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
    "qtpy>=2.4.3",
]

[project.scripts]
loom = "loom.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

# frontend subdirectories are named INDIVIDUALLY (same reasoning as the
# CodeTree incubator): compose renders the gitignored index.html at launch,
# and a wheel built from a run-in checkout must not bake that generated
# page in.
[tool.hatch.build.targets.wheel.force-include]
"frontend/css" = "frontend/css"
"frontend/js" = "frontend/js"
"frontend/templates" = "frontend/templates"
"frontend/3rdparty" = "frontend/3rdparty"
